name: Maven Market Lakehouse CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

defaults:
  run:
    working-directory: maven_market

jobs:
  lint_and_test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: maven_market/pyproject.toml

      - name: Install Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml pyspark

      - name: Lint Code with Ruff
        run: |
          ruff check src/ tests/

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

  bundle_deploy_dev:
    name: Deploy to Dev
    needs: lint_and_test
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python Wheel
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          python -m build --wheel

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Asset Bundle (Dev)
        run: |
          databricks bundle validate -t dev

      - name: Deploy Databricks Asset Bundle (Dev)
        run: |
          databricks bundle deploy -t dev

  bundle_deploy_prod:
    name: Deploy to Production
    needs: lint_and_test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python Wheel
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          python -m build --wheel

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Asset Bundle (Prod)
        run: |
          databricks bundle validate -t prod

      - name: Deploy Databricks Asset Bundle (Prod)
        run: |
          databricks bundle deploy -t prod
