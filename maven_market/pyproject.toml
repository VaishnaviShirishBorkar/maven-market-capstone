[project]
name = "maven_market"
version = "0.0.1"
authors = [{ name = "borkarshirish81@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymongo",
    "pyyaml"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[project.scripts]
main = "maven_market.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120