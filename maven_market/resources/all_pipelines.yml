resources:
  pipelines:
    maven_market_bronze_pipeline:
      name: maven_market_bronze_pipeline_${bundle.target}
      catalog: ${var.catalog}
      target: bronze
      serverless: true
      libraries:
        - notebook:
            path: ../src/maven_market_etl/01_bronze_ingestion.py

    maven_market_silver_pipeline:
      name: maven_market_silver_pipeline_${bundle.target}
      catalog: ${var.catalog}
      target: silver
      serverless: true
      libraries:
        - notebook:
            path: ../src/maven_market_etl/02_silver_transformations.py

    maven_market_gold_pipeline:
      name: maven_market_gold_pipeline_${bundle.target}
      catalog: ${var.catalog}
      target: gold
      serverless: true
      libraries:
        - notebook:
            path: ../src/maven_market_etl/03_gold_aggregates.py