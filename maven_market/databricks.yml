# This is a Declarative Automation Bundle definition for maven_market.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: maven_market
  uuid: 20f9ad1a-ab8b-40d4-91cb-98ffd716bd81

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405605563443378.18.azuredatabricks.net
    variables:
      catalog: maven_market
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405605563443378.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/borkarshirish81@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/borkarshirish81@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: maven_market
      schema: prod
    permissions:
      - user_name: borkarshirish81@gmail.com
        level: CAN_MANAGE
